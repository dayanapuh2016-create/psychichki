.fl.big{font-size:34px;color:#d9a02b}

.c0>b{background:#ffc6d3}.c1>b{background:#ffd8b8}.c2>b{background:#cdeec0}.c3>b{background:#e0cdf5}.c4>b{background:#c7dffa}.c5>b{background:#fff1a8}

.bst.act{border-color:var(--rose);background:#fff0f4}
.combo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#e0708f;text-shadow:0 3px 0 #fff;pointer-events:none;animation:flup 1s forwards;z-index:5;white-space:nowrap}

.mg-hint{text-align:center;font-weight:700;padding:0 14px 6px}
.mg-bar{margin:0 14px 10px}

.tapi.fin{animation:pop .3s}

.roomwrap{position:relative;margin:0 14px;padding-top:104%}
.room{position:absolute;inset:0;border-radius:24px;overflow:hidden;box-shadow:0 10px 24px rgba(214,140,160,.3);touch-action:manipulation}

.cellg{font-size:var(--fs,40px)}.pers{width:16%}.pers svg{display:block;width:100%;height:auto}.win{position:absolute;cursor:pointer}.center{text-align:center}.potbox{font-size:84px;text-align:center;line-height:1.1}.ing{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}.ing button{font-size:30px;background:#fff;border:2px solid #f3cdd8;border-radius:16px;min-width:56px;min-height:56px}.ing button.used{opacity:.25}.card.sm{margin:8px 14px;padding:12px}.sw{width:52px;height:30px;border-radius:15px;background:#e9d6dc;border:0;position:relative;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:var(--rose)}.sw.on::after{left:25px}input[type=range]{width:100%;accent-color:#ef8fab}

function fixPlacement(st){
  const used={};

    const keep=[];
    (st.placed[room]||[]).forEach(f=>{
      if(!f||!FURN[f.id])return;
      const sz=FURN[f.id].s;
      if(f.r<0||f.c<0||f.r+sz[1]>6||f.c+sz[0]>6)return;
      if((used[f.id]||0)>=(st.inv[f.id]||0))return;
      if(f.id!=='rug'&&keep.some(k=>k.id!=='rug'&&f.r<k.r+FURN[k.id].s[1]&&f.r+sz[1]>k.r&&f.c<k.c+FURN[k.id].s[0]&&f.c+sz[0]>k.c))return;

}

const Snd={ctx:null,master:null,timer:null,step:0,
  init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=S?S.set.vol:.6;this.master.connect(this.ctx.destination)}catch(e){}},
  resume(){this.init();try{if(this.ctx&&this.ctx.state!=='running')this.ctx.resume()}catch(e){}if(S&&S.set.music&&!this.timer)this.music(true)},
  vol(v){if(this.master)this.master.gain.value=v},
  tone(f,d,type,v,delay,to){
    if(!this.ctx)return;try{
      const t0=this.ctx.currentTime+(delay||0),o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
      g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v||.2,t0+.015);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
      o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+d+.05)}catch(e){}
  },
  fx(n,k){
    if(!S||!S.set.sound||!this.ctx)return;
    switch(n){
      case'tap':this.tone(700,.06,'sine',.1);break;
      case'swap':this.tone(420,.1,'triangle',.18,0,560);break;
      case'bad':this.tone(220,.15,'sawtooth',.08,0,160);break;
      case'match':{const b=[523,587,659,784,880,988,1047][clamp((k||1)-1,0,6)];this.tone(b,.18,'triangle',.22);this.tone(b*1.5,.14,'sine',.1,.05);break}
      case'special':this.tone(300,.3,'square',.1,0,900);this.tone(900,.25,'sine',.15,.1);break;
      case'coin':this.tone(1175,.1,'square',.07);this.tone(1568,.18,'square',.07,.09);break;
      case'win':[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.28,'triangle',.22,i*.11));break;
      case'lose':[392,349,311,262].forEach((f,i)=>this.tone(f,.3,'triangle',.18,i*.16));break;
      case'scrub':this.tone(900+Math.random()*500,.05,'sine',.04);break;
      case'pop':this.tone(600+Math.random()*300,.09,'sine',.14,0,1000);break;
    }
  },
  music(on){
    clearInterval(this.timer);this.timer=null;
    if(!on||!this.ctx)return;
    const sc=[523,587,659,784,880,784,659,587],bass=[262,220,196,220];
    this.timer=setInterval(()=>{
      if(!S||!S.set.music||document.hidden||!this.ctx||this.ctx.state!=='running')return;
      const i=this.step++;
      this.tone(sc[(i*3+(i>>2))%sc.length],.9,'sine',.05);
      if(i%4===0)this.tone(bass[(i>>2)%4],1.6,'triangle',.06);
    },560);
  }
};

const FRUITS=['🍓','🍑','🍏','🍇','🫐','🍋'];
let _tid=1;
const mkTile=(c,s)=>({id:_tid++,c:c,s:s||null});
const K=(r,c)=>r*100+c;
const KR=k=>Math.floor(k/100), KC=k=>k%100;

// все горизонтальные и вертикальные линии из 3+ одинаковых
function m3Runs(g){
  const H=g.length,W=g[0].length,runs=[];
  for(let r=0;r<H;r++){let c=0;while(c<W){const t=g[r][c];if(!t||t.c<0){c++;continue}let e=c+1;while(e<W&&g[r][e]&&g[r][e].c===t.c)e++;if(e-c>=3){const cells=[];for(let k=c;k<e;k++)cells.push([r,k]);runs.push({d:'h',cells,col:t.c})}c=e}}
  for(let c=0;c<W;c++){let r=0;while(r<H){const t=g[r][c];if(!t||t.c<0){r++;continue}let e=r+1;while(e<H&&g[e][c]&&g[e][c].c===t.c)e++;if(e-r>=3){const cells=[];for(let k=r;k<e;k++)cells.push([k,c]);runs.push({d:'v',cells,col:t.c})}r=e}}
  return runs;
}
function m3Swap(g,a,b){const t=g[a[0]][a[1]];g[a[0]][a[1]]=g[b[0]][b[1]];g[b[0]][b[1]]=t}
// есть ли хоть один допустимый ход; возвращает пару клеток или null
function m3HasMove(g){
  const H=g.length,W=g[0].length;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)for(const d of [[0,1],[1,0]]){
    const r2=r+d[0],c2=c+d[1];if(r2>=H||c2>=W)continue;
    const ta=g[r][c],tb=g[r2][c2];if(!ta||!tb)continue;
    m3Swap(g,[r,c],[r2,c2]);
    const ok=ta.s==='rainbow'||tb.s==='rainbow'||(ta.s&&tb.s)||m3Runs(g).length>0;
    m3Swap(g,[r,c],[r2,c2]);
    if(ok)return[[r,c],[r2,c2]];
  }
  return null;
}
function m3New(L,attempt){
  const W=L.w,H=L.h,rng=mulberry32(L.seed+(attempt||0)*977);
  const g=[];
  for(let r=0;r<H;r++){g.push([]);for(let c=0;c<W;c++){
    let t,n=0;
    do{t=Math.floor(rng()*L.colors);n++}
    while(n<30&&((c>=2&&g[r][c-1].c===t&&g[r][c-2].c===t)||(r>=2&&g[r-1][c].c===t&&g[r-2][c].c===t)));
    g[r].push(mkTile(t));
  }}
  if(!m3HasMove(g))return m3New(L,(attempt||0)+1);
  const jel=[];for(let r=0;r<H;r++)jel.push(new Array(W).fill(0));
  (L.jelly||[]).forEach(j=>{jel[j[0]][j[1]]=j[2]});
  return{g,jel,colors:L.colors,collected:{},score:0,acts:0,chain:1,jelHit:0};
}
const m3Jelly=S0=>S0.jel.reduce((a,row)=>a+row.reduce((x,y)=>x+y,0),0);
function m3Won(S0,L){
  return L.goals.every(g=>g.k==='collect'?(S0.collected[g.c]||0)>=g.n:g.k==='score'?S0.score>=g.n:g.k==='jelly'?m3Jelly(S0)===0:(S0.acts>=g.n));
}
// завершение шага: цепная реакция специальных, очки, цели, создание новых бонусов
function m3Finish(S0,clear,make,chain){
  const g=S0.g,H=g.length,W=g[0].length,q=[...clear];let acts=0;
  const add=(r,c)=>{if(r<0||c<0||r>=H||c>=W)return;const k=K(r,c);if(!clear.has(k)&&g[r][c]){clear.add(k);q.push(k)}};
  for(let i=0;i<q.length;i++){
    const r=KR(q[i]),c=KC(q[i]),t=g[r][c];
    if(!t||!t.s)continue;
    acts++;
    if(t.s==='row')for(let x=0;x<W;x++)add(r,x);
    else if(t.s==='col')for(let y=0;y<H;y++)add(y,c);
    else if(t.s==='bomb'||t.s==='bomb2'){const R=t.s==='bomb2'?2:1;for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++)add(r+y,c+x)}
    else if(t.s==='rainbow'){
      const cnt={};for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=g[y][x];if(u&&u.c>=0)cnt[u.c]=(cnt[u.c]||0)+1}
      let best=-1,bn=0;for(const k in cnt)if(cnt[k]>bn){bn=cnt[k];best=+k}
      for(let y=0;y<H;y++)for(let x=0;x<W;x++){const u=g[y][x];if(u&&u.c===best)add(y,x)}
    }
  }
  const made=[];
  make.forEach(m=>{if(clear.has(K(m.r,m.c)))return;const t=g[m.r][m.c];if(!t)return;t.s=m.s;if(m.s==='rainbow')t.c=-1;made.push({r:m.r,c:m.c,s:m.s,t})});
  const cleared=[];
  clear.forEach(k=>{
    const r=KR(k),c=KC(k),t=g[r][c];if(!t)return;
    cleared.push({r,c,t});g[r][c]=null;
    if(t.c>=0)S0.collected[t.c]=(S0.collected[t.c]||0)+1;
    if(S0.jel[r][c]>0){S0.jel[r][c]--;S0.jelHit++}
  });
  const pts=cleared.length*10*chain+acts*40;
  S0.score+=pts;S0.acts+=acts;
  return{cleared,made,pts,acts,chain};
}
function m3Step(S0,hint,chain){
  const g=S0.g,runs=m3Runs(g);if(!runs.length)return null;
  const clear=new Set(),make=[],used=new Set(),taken=new Set();
  runs.forEach(run=>run.cells.forEach(p=>clear.add(K(p[0],p[1]))));
  const piv=cells=>{if(hint)for(const h of hint)if(cells.some(p=>p[0]===h[0]&&p[1]===h[1]))return h;return cells[Math.floor(cells.length/2)]};
  const place=(cells,s)=>{const p=piv(cells),k=K(p[0],p[1]);if(taken.has(k))return;const t=g[p[0]][p[1]];if(t&&t.s)return;taken.add(k);make.push({r:p[0],c:p[1],s})};
  runs.forEach(run=>{if(run.cells.length>=5){used.add(run);place(run.cells,'rainbow')}});
  const hr=runs.filter(x=>x.d==='h'&&!used.has(x)),vr=runs.filter(x=>x.d==='v'&&!used.has(x));
  hr.forEach(h=>{
    if(used.has(h))return;
    for(const v of vr){
      if(used.has(v)||v.col!==h.col)continue;
      const sh=h.cells.find(p=>v.cells.some(q=>q[0]===p[0]&&q[1]===p[1]));
      if(sh){used.add(h);used.add(v);const k=K(sh[0],sh[1]);if(!g[sh[0]][sh[1]].s&&!taken.has(k)){taken.add(k);make.push({r:sh[0],c:sh[1],s:'bomb'})}break}
    }
  });
  runs.forEach(run=>{if(!used.has(run)&&run.cells.length===4){used.add(run);place(run.cells,run.d==='h'?'row':'col')}});
  make.forEach(m=>clear.delete(K(m.r,m.c)));
  return m3Finish(S0,clear,make,chain||1);
}
// обмен: возвращает 'combo' | 'match' | null (поле остаётся обменянным — вызывающий откатывает при null)
function m3TrySwap(S0,a,b){
  const g=S0.g,ta=g[a[0]][a[1]],tb=g[b[0]][b[1]];
  if(!ta||!tb)return null;
  m3Swap(g,a,b);
  if(ta.s==='rainbow'||tb.s==='rainbow'||(ta.s&&tb.s))return'combo';
  return m3Runs(g).length?'match':null;
}
function m3Combo(S0,a,b,chain){
  const g=S0.g,H=g.length,W=g[0].length,clear=new Set(),x=g[a[0]][a[1]],y=g[b[0]][b[1]];
  const all=f=>{for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(g[r][c]&&f(g[r][c]))clear.add(K(r,c))};
  if(x.s==='rainbow'&&y.s==='rainbow'){all(()=>true)}

    const rb=x.s==='rainbow'?x:y,o=rb===x?y:x;
    rb.s=null;all(t=>t===rb);
    if(!o.s)all(t=>t.c===o.c);

  const g=S0.g,H=g.length,W=g[0].length,fresh=[];
  for(let c=0;c<W;c++){
    let w=H-1;
    for(let r=H-1;r>=0;r--)if(g[r][c]){if(w!==r){g[w][c]=g[r][c];g[r][c]=null}w--}
    let k=0;
    for(let r=w;r>=0;r--){const t=mkTile(Math.floor(Math.random()*S0.colors));t.fresh=++k;g[r][c]=t;fresh.push(t)}
  }
  return fresh;
}
function m3Shuffle(S0){
  const g=S0.g,H=g.length,W=g[0].length,tiles=[];
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(g[r][c])tiles.push(g[r][c]);
  for(let n=0;n<80;n++){
    for(let i=tiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=tiles[i];tiles[i]=tiles[j];tiles[j]=t}
    let i=0;for(let r=0;r<H;r++)for(let c=0;c<W;c++)g[r][c]=tiles[i++];
    if(!m3Runs(g).length&&m3HasMove(g))return true;
  }
  // запасной вариант: перекрасить обычные фишки
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const t=g[r][c];if(t&&t.c>=0)t.c=Math.floor(Math.random()*S0.colors)}
  for(let k=0;k<200&&(m3Runs(g).length||!m3HasMove(g));k++){
    for(let r=0;r<H;r++)for(let c=0;c<W;c++){const t=g[r][c];if(t&&t.c>=0)t.c=Math.floor(Math.random()*S0.colors)}
  }
  return true;
}

/* ----- Генерация 500 уровней (детерминированно по номеру) ----- */
function genLevel(n){
  const rng=mulberry32(n*9973+7),t=Math.min(1,(n-1)/499);
  const colors=n<=12?4:(n<=120?5:6),w=n<=8?7:8,h=w;
  const kinds=['c1','sc','jl','c2','sp','c1','jc','sc','c2','boss'];
  let kind=kinds[(n-1)%10];if(n<=3)kind='c1';else if(n<=5)kind='sc';
  let moves=Math.max(15,27-Math.floor(n/42));
  const order=[...Array(colors).keys()].sort(()=>rng()-.5);
  const cr=(0.55+0.85*t)*(5/colors);
  const goals=[];let jelly=[],layers=0;
  const mkJelly=()=>{
    const cnt=6+Math.floor(t*22),seen={};jelly=[];
    const two=n>100?t*0.6:0;
    let guard=0;
    while(jelly.length<cnt&&guard++<400){
      const r=Math.floor(rng()*h),c=Math.floor(rng()*Math.ceil(w/2)),l=rng()<two?2:1;
      [[r,c],[r,w-1-c]].forEach(p=>{const k=p[0]*100+p[1];if(!seen[k]){seen[k]=1;jelly.push([p[0],p[1],l]);layers+=l}});
    }
  };
  const collect=(i,share)=>goals.push({k:'collect',c:order[i],n:Math.max(7,Math.round(moves*cr*share))});
  const score=share=>goals.push({k:'score',n:Math.round(moves*(30+60*t)*share/10)*10});
  if(kind==='c1')collect(0,1);
  else if(kind==='sc')score(1);
  else if(kind==='jl'){mkJelly();moves+=Math.ceil(layers*0.42);goals.push({k:'jelly'})}
  else if(kind==='c2'){collect(0,.62);collect(1,.62)}
  else if(kind==='sp'){moves+=3;goals.push({k:'special',n:2+Math.floor(t*5)})}
  else if(kind==='jc'){mkJelly();moves+=Math.ceil(layers*0.36);goals.push({k:'jelly'});collect(0,.5)}
  else{mkJelly();moves+=Math.ceil(layers*0.42)+2;goals.push({k:'jelly'});collect(0,.5);score(.7)}
  return{n,w,h,colors,moves,goals,jelly,kind,seed:n*31+5};
}

/* ===== 8. ИГРА MATCH-3 (интерфейс, анимации, победа/поражение) ===== */
const G={L:null,S0:null,moves:0,busy:false,over:false,els:new Map(),cell:40,sel:null,mode:null,maxChain:1,attempt:0,hintT:null,bg:[]};
const worldOf=n=>Math.floor((n-1)/20);
const BOOST={hammer:'b_hammer',shuffle:'b_shuffle',moves:'b_moves',bomb:'b_bomb'};

function startLevel(n,retry){
  rollDay();
  if(n>S.level){toast('Этот уровень пока закрыт 🔒');return}
  if(!S.cleared[n]&&S.dailyDone>=20){
    modal(`<h3>На сегодня хватит 🌙</h3><p style="text-align:center">Сегодня пройдено ${S.dailyDone}/20 новых уровней. Новые уровни откроются завтра!</p><p class="muted" style="text-align:center">Пока можно перепройти старые уровни, прибраться дома, приготовить ужин или провести время с Дианой.</p><div class="mbtns"><button class="btn sec" data-a="closeModal">Понятно</button><button class="btn" data-a="goHouse">Наш дом</button></div>`);
    return;
  }
  const L=genLevel(n);
  G.attempt=retry?G.attempt+1:0;
  G.L=L;G.S0=m3New(L,G.attempt);G.moves=L.moves;G.busy=false;G.over=false;G.sel=null;G.mode=null;G.maxChain=1;G.els=new Map();
  go('game',n);
}
R.game=function(n){
  const L=G.L;
  setScreen(`<div class="gm"><div class="gm-top"><button class="back" data-a="gExit">←</button><div class="ttl">Уровень ${n}</div><div class="pill">⭐ <span id="gScore">0</span></div></div>
  <div class="goals" id="gGoals"></div>
  <div class="hudrow"><span class="chip">Ходы: <b id="gMoves">${G.moves}</b></span><span class="chip">Сегодня ${S.dailyDone}/20</span></div>
  <div id="board"></div><div class="boosters" id="gBoost"></div></div>`);
  layoutBoard();hud();gBoosters();startHint();
  const b=$('#board');
  b.addEventListener('pointerdown',onDown);b.addEventListener('pointermove',onMove);
  b.addEventListener('pointerup',onUp);b.addEventListener('pointercancel',()=>{ptr=null});
  if(!S.tipM3){S.tipM3=true;save();modal(`<h3>Как играть 🍓</h3><p>Меняй соседние фрукты местами (свайп или два тапа) и собирай 3 и больше в ряд.</p><p>• 4 в ряд — <b>молния</b> ↔️ ↕️ (чистит линию)<br>• Т или Г-образная фигура — <b>бомба</b> 💣<br>• 5 в ряд — <b>радуга</b> 🌈 (убирает цвет)<br>• Поменяй два бонуса местами — получится комбо!</p><p class="muted">Слева вверху — цели уровня. Усилители внизу помогут, если что-то не получается.</p><div class="mbtns"><button class="btn" data-a="closeModal">Играем!</button></div>`)}
};
function layoutBoard(){
  const b=$('#board');if(!b||!G.L)return;
  const L=G.L,sc=$('#screen');
  const availW=sc.clientWidth-24,availH=sc.clientHeight-250;
  G.cell=clamp(Math.floor(Math.min(availW/L.w,availH/L.h)),28,58);
  const cs=G.cell;
  b.style.width=L.w*cs+'px';b.style.height=L.h*cs+'px';
  b.querySelectorAll('.bcell').forEach(e=>e.remove());
  G.bg=[];
  for(let r=0;r<L.h;r++){G.bg.push([]);for(let c=0;c<L.w;c++){
    const d=document.createElement('div');d.className='bcell';
    d.style.cssText=`left:${c*cs+2}px;top:${r*cs+2}px;width:${cs-4}px;height:${cs-4}px`;
    b.insertBefore(d,b.firstChild);G.bg[r].push(d)}}
  G.els.forEach(el=>{el.style.width=el.style.height=cs+'px';el.style.setProperty('--cs',cs+'px')});
  gSync();hud();
}
window.addEventListener('resize',()=>{if(UI.screen==='game'&&G.L)layoutBoard()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{if(UI.screen==='game'&&G.L)layoutBoard()},250));

function tileLook(el,t){
  const sel=G.sel&&G.sel.id===t.id?' sel':'';
  el.className='tile c'+(t.c<0?'R':t.c)+(t.s?' sp':'')+sel;
  const b=el.firstChild;
  const bk=t.s==='row'?'row':t.s==='col'?'col':(t.s==='bomb'||t.s==='bomb2')?'bomb':'';
  const key=t.c+'|'+bk;
  if(el._k!==key){el._k=key;b.innerHTML=fruitSvg(t.c)+(bk?'<span class="bd">'+BADGE[bk]+'</span>':'')}
}
function gSync(){
  const board=$('#board');if(!board||!G.S0)return;
  const g=G.S0.g,cs=G.cell,alive=new Set();
  for(let r=0;r<g.length;r++)for(let c=0;c<g[0].length;c++){
    const t=g[r][c];if(!t)continue;
    alive.add(t.id);
    let el=G.els.get(t.id);
    if(!el){
      el=document.createElement('div');el.style.width=el.style.height=cs+'px';el.style.setProperty('--cs',cs+'px');el.innerHTML='<b></b>';
      el.style.transform=`translate(${c*cs}px,${(t.fresh?-t.fresh:r)*cs}px)`;
      board.appendChild(el);G.els.set(t.id,el);el.getBoundingClientRect();
    }
    tileLook(el,t);
    el.style.transform=`translate(${c*cs}px,${r*cs}px)`;
    delete t.fresh;
  }
  G.els.forEach((el,id)=>{if(!alive.has(id)&&!el._dying){el.remove();G.els.delete(id)}});
}
function hud(){
  if(!G.S0||!$('#gGoals'))return;
  const S0=G.S0,L=G.L;
  $('#gScore').textContent=S0.score;$('#gMoves').textContent=G.moves;
  $('#gGoals').innerHTML=L.goals.map(g=>{
    let ic,left;
    if(g.k==='collect'){ic=fruitSvg(g.c,26);left=Math.max(0,g.n-(S0.collected[g.c]||0))}
    else if(g.k==='score'){ic='⭐';left=Math.max(0,g.n-S0.score)}
    else if(g.k==='jelly'){ic='💗';left=m3Jelly(S0)}
    else{ic='⚡';left=Math.max(0,g.n-S0.acts)}
    return `<div class="goal ${left?'':'ok'}">${ic} ${left?left:'✓'}</div>`}).join('');
  G.bg.forEach((row,r)=>row.forEach((d,c)=>{const j=S0.jel[r][c];d.className='bcell'+(j===1?' j1':j>=2?' j2':'')}));
}
function gBoosters(){
  const e=$('#gBoost');if(!e)return;
  const nm={hammer:'🔨',shuffle:'🔀',moves:'➕',bomb:'💥'};
  e.innerHTML=Object.keys(BOOST).map(k=>{const id=BOOST[k],n=have(id);
    return `<button class="bst ${G.mode===k?'act':''}" data-a="gBoost" data-k="${k}">${nm[k]}<small>${n?'×'+n:ITEMS[id].price+'🪙'}</small></button>`}).join('');
}
function useBoost(id){
  if(have(id)>0){useItem(id);save();return true}
  if(S.coins>=ITEMS[id].price){return spend(ITEMS[id].price)}
  toast('Не хватает монет 🪙');return false;
}
function clearHint(){clearTimeout(G.hintT);G.els.forEach(el=>el.classList.remove('hint'))}
function startHint(){
  clearHint();
  G.hintT=setTimeout(()=>{
    if(G.busy||G.over||UI.screen!=='game')return;
    const m=m3HasMove(G.S0.g);if(!m)return;
    m.forEach(p=>{const t=G.S0.g[p[0]][p[1]],el=t&&G.els.get(t.id);if(el)el.classList.add('hint')});
  },7000);
}
// ввод
let ptr=null;
function cellAt(e){
  const b=$('#board').getBoundingClientRect(),c=Math.floor((e.clientX-b.left)/G.cell),r=Math.floor((e.clientY-b.top)/G.cell);
  return(r>=0&&c>=0&&r<G.L.h&&c<G.L.w)?[r,c]:null;
}
function onDown(e){
  if(G.busy||G.over)return;
  const p=cellAt(e);if(!p)return;
  clearHint();ptr={p,x:e.clientX,y:e.clientY,done:false};
  try{e.target.setPointerCapture&&$('#board').setPointerCapture(e.pointerId)}catch(_){}
}
function onMove(e){
  if(!ptr||ptr.done||G.busy||G.over)return;
  const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))<G.cell*.33)return;
  ptr.done=true;
  const r=ptr.p[0],c=ptr.p[1];
  const t=Math.abs(dx)>Math.abs(dy)?[r,c+(dx>0?1:-1)]:[r+(dy>0?1:-1),c];
  if(t[0]<0||t[1]<0||t[0]>=G.L.h||t[1]>=G.L.w)return;
  G.sel=null;gTrySwap(ptr.p,t);
}
function onUp(){
  if(!ptr)return;const was=ptr;ptr=null;
  if(was.done||G.busy||G.over)return;
  onTap(was.p);
}
function onTap(p){
  if(G.mode){gUseTool(p);return}
  const t=G.S0.g[p[0]][p[1]];if(!t)return;
  if(G.sel){
    const s=G.sel.p;
    if(s[0]===p[0]&&s[1]===p[1]){G.sel=null;gSync();return}
    if(Math.abs(s[0]-p[0])+Math.abs(s[1]-p[1])===1){G.sel=null;gSync();gTrySwap(s,p);return}
  }
  G.sel={p,id:t.id};gSync();Snd.fx('tap');
}
async function gTrySwap(a,b){
  if(G.busy||G.over)return;
  G.busy=true;clearHint();
  const kind=m3TrySwap(G.S0,a,b);
  gSync();Snd.fx('swap');await sleep(170);
  if(!kind){m3Swap(G.S0.g,a,b);gSync();Snd.fx('bad');await sleep(170);G.busy=false;startHint();return}
  G.moves--;hud();
  await gRun(kind==='combo'?()=>m3Combo(G.S0,a,b,1):()=>m3Step(G.S0,[a,b],1));
  await gAfter();
}
async function gRun(first){
  let chain=1,res=first();
  while(res){
    G.maxChain=Math.max(G.maxChain,chain);
    gPop(res,chain);hud();
    await sleep(S.set.calm?60:240);
    res.cleared.forEach(x=>{const el=G.els.get(x.t.id);if(el){el.remove();G.els.delete(x.t.id)}});
    m3Fall(G.S0);gSync();
    await sleep(S.set.calm?60:300);
    chain++;res=m3Step(G.S0,null,chain);
  }
}
function gPop(res,chain){
  res.cleared.forEach(x=>{const el=G.els.get(x.t.id);if(el){el._dying=true;el.classList.add('pop')}});
  res.made.forEach(m=>{const el=G.els.get(m.t.id);if(el)tileLook(el,m.t)});
  Snd.fx('match',chain);if(res.acts||res.made.length)Snd.fx('special');
  const br=$('#board').getBoundingClientRect();
  if(chain>=2){fxFloat('Комбо ×'+chain+'!',br.left+br.width/2,br.top+br.height*0.35,'big')}
  else if(res.cleared.length>=6&&!res.acts)fxFloat(pick(['Здорово!','Мило!','Отлично!']),br.left+br.width/2,br.top+br.height*0.4);
  if(res.acts)burst(['💥','✨','⭐'],8);
}
async function gAfter(){
  if(!m3Won(G.S0,G.L)&&!m3HasMove(G.S0.g)){toast('Нет ходов — перемешиваем 🔀');m3Shuffle(G.S0);gSync();await sleep(450)}
  hud();
  if(m3Won(G.S0,G.L))return gWin();
  if(G.moves<=0)return gLose();
  G.busy=false;startHint();
}
async function gUseTool(p){
  const mode=G.mode,id=BOOST[mode];
  const t=G.S0.g[p[0]][p[1]];if(!t)return;
  if(mode==='bomb'&&(t.s||t.c<0)){toast('Выбери обычный предмет');return}
  if(!useBoost(id))return;
  G.mode=null;G.busy=true;gBoosters();
  if(mode==='hammer'){await gRun(()=>m3Hit(G.S0,p[0],p[1]))}
  else{t.s='bomb';gSync();Snd.fx('special');await sleep(250)}
  await gAfter();
}
A.gBoost=d=>{
  if(G.busy||G.over)return;
  const k=d.k,id=BOOST[k];
  if(have(id)<1&&S.coins<ITEMS[id].price){toast('Не хватает монет 🪙');return}
  if(k==='shuffle'){if(useBoost(id)){G.busy=true;m3Shuffle(G.S0);gSync();Snd.fx('special');gBoosters();setTimeout(()=>gAfter(),500)}return}
  if(k==='moves'){if(useBoost(id)){G.moves+=5;hud();gBoosters();toast('+5 ходов ➕')}return}
  G.mode=G.mode===k?null:k;gBoosters();
  if(G.mode)toast(k==='hammer'?'Нажми на предмет, который убрать':'Нажми на предмет, чтобы сделать бомбу');
};
function gWin(){
  G.over=true;G.busy=true;clearHint();
  const L=G.L,n=L.n,ratio=G.moves/L.moves,stars=ratio>=.4?3:ratio>=.2?2:1;
  const first=!S.cleared[n];
  const coins=first?20+stars*10+Math.min(30,G.maxChain*5):5;
  if(first){S.cleared[n]=stars;S.dailyDone++;S.stats.wins++;S.level=Math.max(S.level,Math.min(500,n+1));dq('lv')}
  else if(stars>(S.cleared[n]||0))S.cleared[n]=stars;
  S.coins+=coins;renderTop();checkAch();save(true);
  Snd.fx('win');burst(['⭐','🎉','🍓','✨'],18);
  UI.lock=true;
  modal(`<h3>Уровень ${n} пройден! 🎉</h3><div style="text-align:center;font-size:44px;margin:4px 0">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p style="text-align:center"><b>+${coins} 🪙</b>${first?'':' <span class="muted">(повторное прохождение)</span>'}</p>
    <p class="muted" style="text-align:center">Сегодня пройдено ${S.dailyDone}/20 уровней</p>
    <div class="mbtns"><button class="btn" data-a="gSleep">Спать 🌙</button></div>`);
}
function gLose(){
  G.over=true;G.busy=true;clearHint();Snd.fx('lose');UI.lock=true;
  modal(`<h3>Не получилось 😿</h3><p style="text-align:center">Ходы закончились. Это не расходует дневной лимит — пробуй ещё!</p>

}

A.cell=d=>{
  const room=ROOMS[UI.roomIdx],list=S.placed[room.id],r=+d.r,c=+d.c;
  const at=list.filter(f=>covers(f,r,c)&&f.id!=='rug').pop()||null;
  const origin=(id)=>{const s=FURN[id].s;return[clamp(r-Math.floor((s[1]-1)/2),0,6-s[1]),clamp(c-Math.floor((s[0]-1)/2),0,6-s[0])]};
  if(UI.sel&&UI.sel.mv){
    const f=UI.sel.mvRef;
    if(d.id&&at===f){UI.sel=null;R.house('keep');return}
    const o=origin(f.id);
    if(!canPlace(list,f.id,o[0],o[1],f)){toast('Сюда не помещается');return}
    f.r=o[0];f.c=o[1];UI.sel=null;save();Snd.fx('pop');R.house('keep');return;
  }
  if(UI.sel){
    const id=UI.sel.id;if(freeCount(id)<1){UI.sel=null;R.house('keep');return}

    if(!canPlace(list,id,o[0],o[1])){toast('Сюда не помещается');return}
    list.push({id,r:o[0],c:o[1]});S.stats.placed++;Snd.fx('pop');
    if(freeCount(id)<1)UI.sel=null;
    checkAch();save();R.house('keep');return;
  }
  const rug=at?null:list.find(f=>f.id==='rug'&&covers(f,r,c));
  const pickf=at||rug;
  if(pickf){UI.sel={id:pickf.id,mv:{r:pickf.r,c:pickf.c},mvRef:pickf};R.house('keep');return}

    h+=`<div class="card sm"><div class="row"><div style="font-size:38px">${r.e}</div><div class="sp"><b>${r.n}</b><div class="muted">${Object.keys(r.need).map(id=>`<span style="color:${have(id)>=r.need[id]?'#4a9a5a':'#d0506a'}">${ITEMS[id].e}${have(id)}/${r.need[id]}</span>`).join(' ')}</div></div><button class="btn sm ${ok?'':'off'}" data-a="cookStart" data-id="${r.id}">Готовить</button></div></div>`;
  });
  const dishes=Object.keys(S.inv).filter(id=>ITEMS[id]&&ITEMS[id].dish&&S.inv[id]>0);
  if(dishes.length)h+=`<div class="card"><h3>Готовые блюда</h3>${dishes.map(id=>`<div class="row" style="margin:6px 0"><span style="font-size:28px">${ITEMS[id].e}</span><b class="sp">${ITEMS[id].name} ×${S.inv[id]}</b><button class="btn sm" data-a="eat" data-id="${id}">Съесть</button></div>`).join('')}</div>`;
  setScreen(h);
};
A.cookStart=d=>{
  const r=RECIPES.find(x=>x.id===d.id);
  if(!Object.keys(r.need).every(id=>have(id)>=r.need[id])){toast('Не хватает продуктов 🛒');return}
  const units=[];Object.keys(r.need).forEach(id=>{for(let i=0;i<r.need[id];i++)units.push(id)});
  UI.cook={r,units,added:0,stir:0,used:{}};UI.lock=true;cookRender();
};
function cookRender(){
  const c=UI.cook,stirPhase=c.added>=c.units.length;
  modal(`<h3>${c.r.e} ${c.r.n}</h3><div class="potbox" id="pot" ${stirPhase?'data-a="cookStir"':''}>${stirPhase?'🍲':'🥘'}</div>
  <p class="center"><b>${stirPhase?`Помешай ложкой! Нажимай на кастрюлю (${c.stir}/6) 🥄`:'Добавь ингредиенты — нажимай на них'}</b></p>
  ${stirPhase?`<div class="bar g"><i style="width:${c.stir/6*100}%"></i></div>`:`<div class="ing">${c.units.map((id,i)=>`<button class="${c.used[i]?'used':''}" data-a="cookAdd" data-i="${i}">${ITEMS[id].e}</button>`).join('')}</div>`}
  <div class="mbtns"><button class="btn sec" data-a="cookCancel">Отмена</button></div>`);
}
A.cookAdd=d=>{const c=UI.cook;if(c.used[d.i])return;c.used[d.i]=true;c.added++;Snd.fx('pop');cookRender()};
A.cookCancel=()=>{UI.cook=null;closeModal()};
A.cookStir=()=>{
  const c=UI.cook;if(!c)return;c.stir++;Snd.fx('pop');
  if(c.stir<6){cookRender();const p=$('#pot');if(p)p.style.animation='shake .25s';return}
  if(!Object.keys(c.r.need).every(id=>have(id)>=c.r.need[id])){closeModal();toast('Продукты закончились 😿');return}
  Object.keys(c.r.need).forEach(id=>useItem(id,c.r.need[id]));
  addItem('dish_'+c.r.id,1);S.stats.cooks++;dq('cook');S.coins+=8;renderTop();checkAch();save(true);UI.cook=null;UI.lock=false;
  Snd.fx('win');burst(['✨','🍽️','😋'],14);
  modal(`<h3>Готово! ✨</h3><div class="potbox">${c.r.e}</div><p class="center"><b>${c.r.n}</b> приготовлено! Диана уже принюхивается из соседней комнаты.<br>+8 🪙</p><div class="mbtns"><button class="btn sec" data-a="cookDone">Убрать в запас</button><button class="btn" data-a="cookEat" data-id="dish_${c.r.id}">Поесть вместе 😋</button></div>`);
};

A.assign=d=>{
  rollDay();
  const t=DIANA_TASKS.find(x=>x.id===d.id);
  if(t.pet&&!S.pet){toast('Сначала заведите собаку 🐶');return}
  const lv=skillLvl(t.id);
  let w={perfect:8+7*lv,init:5,half:Math.max(3,16-lv),forgot:Math.max(2,14-lv),phone:Math.max(2,12-lv*.8),lie:Math.max(2,10-lv*.8),mix:Math.max(1,8-lv*.6),ignore:Math.max(2,10-lv*.8)};
  let key=null;
  if(t.id==='feeddog'&&have('dogfood')<1)key='nofood';
  if(!key){let tot=0;Object.values(w).forEach(v=>tot+=v);let x=Math.random()*tot;for(const k in w){x-=w[k];if(x<=0){key=k;break}}key=key||'perfect'}
  let o,text;
  if(key==='nofood'){o={coins:0,love:0,mood:0,xp:.2};text='Диана полезла за кормом, а корм закончился. «Купи корм!» — радостно сообщила она.'}
  else{o=OUTCOMES[key];text=pick(o.t).replace('{task}',t.n.toLowerCase())}
  const good=key==='perfect'||key==='init',some=good||key==='half';
  // эффекты в мире
  if(some){
    S.clean=clamp(S.clean+(key==='half'?5:key==='init'?16:12),0,100);
    if(t.id==='feeddog'&&useItem('dogfood')){S.pet.hunger=clamp(S.pet.hunger+(key==='half'?20:35),0,100)}
    if(t.id==='poop'){S.pet.clean=clamp(S.pet.clean+10,0,100)}
  }
  const before=skillLvl(t.id);S.skills[t.id]=(S.skills[t.id]||0)+o.xp;const after=skillLvl(t.id);
  if(good)S.stats.dianaOk++;
  if(o.love>0)addLove(o.love);else if(o.love<0)S.rel.love=clamp(S.rel.love+o.love,0,100);
  S.rel.mD=clamp(S.rel.mD+o.mood,0,100);
  dq('diana');if(o.coins)S.coins+=o.coins;renderTop();checkAch();save();
  if(good){Snd.fx('win');burst(['✨','🧹','💗'],10)}
  const mood=good?'cute':(key==='lie'?'sleep':undefined);
  const ev=drainEvents();
  modal(`<div class="center">${av('d',90,mood)}</div><h3>${t.e} ${t.n}</h3><p class="center">${text}</p><p class="center"><b>${o.coins?'+'+o.coins+' 🪙':'без награды'}</b>${o.love>0?' · +'+o.love+' ❤️':''}</p>${after>before?`<p class="center"><b>⭐ Навык Дианы вырос до уровня ${after}!</b></p>`:''}<p class="center muted">${pick(CHAT.m)}</p>${ev}<div class="mbtns"><button class="btn" data-a="assignOk">Ладно 😄</button></div>`);
};

function mgScrub(ar,w,h,cfg,mc){
  if(cfg.deco){const d=document.createElement('div');d.className='mg-bgdeco';d.textContent=cfg.deco.repeat(cfg.deco==='🪟'||cfg.deco==='📚'?4:cfg.deco.length>0?1:0);ar.appendChild(d)}
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.width=w+'px';cv.style.height=h+'px';ar.appendChild(cv);
  const x=cv.getContext('2d'),kind=cfg.dirt;
  const rn=Math.random;
  if(kind==='foam'){x.fillStyle='rgba(255,255,255,.55)';x.fillRect(0,0,w,h);for(let i=0;i<150;i++){x.beginPath();x.fillStyle='rgba(255,255,255,'+(.6+rn()*.4)+')';x.strokeStyle='rgba(180,220,245,.8)';x.lineWidth=1.5;const r=8+rn()*22;x.arc(rn()*w,rn()*h,r,0,6.3);x.fill();x.stroke()}}
  else if(kind==='dust'){x.fillStyle='rgba(205,190,175,.75)';x.fillRect(0,0,w,h);for(let i=0;i<120;i++){x.fillStyle='rgba(160,140,120,'+(.25+rn()*.3)+')';x.beginPath();x.arc(rn()*w,rn()*h,6+rn()*20,0,6.3);x.fill()}}
  else{x.fillStyle='rgba(135,105,75,.55)';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){x.fillStyle='rgba(90,62,40,'+(.25+rn()*.35)+')';x.beginPath();x.ellipse(rn()*w,rn()*h,10+rn()*28,6+rn()*18,rn()*3,0,6.3);x.fill()}}
  const tool=document.createElement('div');tool.className='mg-tool';tool.textContent=cfg.tool||'🧽';ar.appendChild(tool);
  const sample=()=>{const d=x.getImageData(0,0,w,h).data;let n=0,t=0;for(let yy=0;yy<h;yy+=10)for(let xx=0;xx<w;xx+=10){t++;if(d[(yy*w+xx)*4+3]>35)n++}return{n,t}};
  const base=sample().n||1;let last=null,lastS=0,moves=0,snd=0;
  const erase=(a,b)=>{x.globalCompositeOperation='destination-out';x.lineCap='round';x.lineJoin='round';x.lineWidth=Math.max(40,w*.12);x.strokeStyle='#000';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();x.globalCompositeOperation='source-over'};
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  const upd=()=>{const p=1-sample().n/base;mgProg(Math.min(p/0.93,1));if(p>=0.93&&!MG.done){x.clearRect(0,0,w,h);tool.style.display='none';mgFinish(mc)}};
  ar.addEventListener('pointerdown',e=>{if(MG.done)return;try{ar.setPointerCapture(e.pointerId)}catch(_){}last=pos(e);tool.style.display='block';tool.style.left=last.x+'px';tool.style.top=last.y+'px';erase(last,{x:last.x+.1,y:last.y+.1})});
  ar.addEventListener('pointermove',e=>{if(!last||MG.done)return;const p=pos(e);erase(last,p);last=p;tool.style.left=p.x+'px';tool.style.top=p.y+'px';
    const n=Date.now();if(n-snd>90){snd=n;Snd.fx('scrub')}
    if(n-lastS>180){lastS=n;upd()}});
  const end=()=>{last=null;tool.style.display='none';if(!MG.done)upd()};
  ar.addEventListener('pointerup',end);ar.addEventListener('pointercancel',end);
}
function mgTap(ar,w,h,cfg,mc){
  const items=cfg.items.map(i=>typeof i==='string'?{e:i,after:cfg.after||'✨',taps:cfg.taps||1}:Object.assign({after:cfg.after||'✨',taps:cfg.taps||1},i));
  const n=items.length,cols=n<=4?2:3,rows=Math.ceil(n/cols);
  let left=n,doneN=0,step=0;
  const hint=$('#mgHint');
  items.forEach((it,i)=>{
    const b=document.createElement('button');b.className='tapi';b.textContent=it.e;b.style.touchAction='manipulation';
    const cx=((i%cols)+.5)/cols*100,cy=(Math.floor(i/cols)+.5)/rows*100;
    b.style.left=cx+'%';b.style.top=cy+'%';b.style.transform='translate(-50%,-50%)';b.style.fontSize=Math.min(64,w/cols*.5)+'px';
    let t=it.taps,fin=false;
    b.addEventListener('pointerdown',ev=>{
      ev.preventDefault();if(fin||MG.done)return;
      if(cfg.seq&&cfg.items.indexOf(it.e)!==undefined&&i!==step){toast('Сначала: '+cfg.seq[step]);return}
      t--;Snd.fx('pop');b.style.transform='translate(-50%,-50%) scale(.85)';setTimeout(()=>{b.style.transform='translate(-50%,-50%)'},120);
      if(t<=0){fin=true;b.textContent=it.after;b.classList.add('fin');b.style.pointerEvents='none';doneN++;step++;mgProg(doneN/n);burst([it.after],3);
        if(cfg.seq&&hint)hint.textContent=step<n?cfg.seq[step]:'Готово!';
        if(doneN>=n)mgFinish(mc)}
      else{b.textContent=it.e==='🪴'||cfg.after==='💦'?'💧':it.e;setTimeout(()=>{if(!fin)b.textContent=it.e},200)}
    });
    ar.appendChild(b);
  });
  if(cfg.seq&&hint)hint.textContent=cfg.seq[0];
}
function mgDrag(ar,w,h,cfg,mc){
  const z=document.createElement('div');z.className='zone';z.style.cssText=`left:12%;top:5%;width:76%;height:34%`;z.innerHTML=`${cfg.zone.e}<small>${cfg.zone.t}</small>`;ar.appendChild(z);
  const n=cfg.items.length;let doneN=0;
  cfg.items.forEach((e,i)=>{
    const d=document.createElement('div');d.className='drag';d.textContent=e;d.style.fontSize=Math.min(52,w*.14)+'px';
    const hx=((i%3)*30+12)/100*w,hy=(0.52+Math.floor(i/3)*0.2)*h;
    d.style.left=hx+'px';d.style.top=hy+'px';
    let off=null;
    d.addEventListener('pointerdown',ev=>{if(MG.done||d._done)return;ev.preventDefault();try{d.setPointerCapture(ev.pointerId)}catch(_){}const r=d.getBoundingClientRect();off={x:ev.clientX-r.left,y:ev.clientY-r.top};d.style.transition='none';d.style.zIndex=9;d.style.transform='scale(1.2)'});
    d.addEventListener('pointermove',ev=>{if(!off)return;const a=ar.getBoundingClientRect();d.style.left=(ev.clientX-a.left-off.x)+'px';d.style.top=(ev.clientY-a.top-off.y)+'px'});
    const up=ev=>{
      if(!off)return;off=null;d.style.transform='';d.style.zIndex=3;
      const r=d.getBoundingClientRect(),zr=z.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      if(cx>zr.left&&cx<zr.right&&cy>zr.top&&cy<zr.bottom){
        d._done=true;d.classList.add('placed');d.style.pointerEvents='none';
        const k=doneN;d.style.left=(w*.12+w*.76*(0.15+(k%3)*0.3))+'px';d.style.top=(h*.05+h*.34*(0.2+Math.floor(k/3)*0.38))+'px';d.style.transition='all .25s';
        doneN++;Snd.fx('pop');mgProg(doneN/n);if(doneN>=n)mgFinish(mc);
      }else{d.style.transition='all .25s';d.style.left=hx+'px';d.style.top=hy+'px'}
    };
    d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
    ar.appendChild(d);
  });
}

  UI.sleepArg=arg;
  const W=$('#walkers');
  W.innerHTML=`<div style="position:absolute;left:14%;bottom:-4%;width:24%;animation:walk 2s ease-out both">${charSvg('m',{width:100,wear:{top:'pajamas'}})}</div><div style="position:absolute;left:42%;bottom:-4%;width:24%;animation:walk 2.4s ease-out both">${charSvg('d',{width:100,wear:{top:'pajamas'}})}</div>${S.pet?`<div style="position:absolute;right:4%;bottom:-8%;width:26%;animation:walk 2.8s ease-out both">${dogSvg(S.pet,'sit',100)}</div>`:''}`;
  const cap=n=>{const e=$('#sleepCap');if(e)e.textContent=SLEEP_CAPS[n]};
  const alive=()=>UI.screen==='sleep';
  UI.sleepT=[
    setTimeout(()=>{if(!alive())return;cap(1);W.innerHTML='';
      $('#sleepers').innerHTML=`<div style="position:absolute;left:15%;bottom:-3%;width:25%">${av('m',96,'sleep')}</div><div style="position:absolute;left:41%;bottom:-3%;width:25%">${av('d',96,'sleep')}</div>`;
      $('#sleepBlanket').style.opacity=1;
      $('#dogbedSl').innerHTML=`<div style="font-size:50px;line-height:.6;margin-bottom:-6px">🧺</div>${S.pet?dogSvg(S.pet,'sleep',96):'<div style="font-size:30px">🧸</div>'}`;
      Snd.fx('special')},2900),
    setTimeout(()=>{if(!alive())return;cap(2);const n=$('#night');for(let i=0;i<4;i++){const z=document.createElement('span');z.className='zzz';z.textContent='Z';z.style.cssText=`left:${22+i*13}%;bottom:44%;animation-delay:${i*.6}s;font-size:${20+i*4}px`;n.appendChild(z)}},4700),
    setTimeout(()=>{if(!alive())return;cap(3)},6600),
    setTimeout(()=>{if(!alive())return;cap(4);const b=$('#sleepBtn');if(b){b.style.opacity=1;b.style.pointerEvents='auto'}},8300)
  ];
};
A.sleepEnd=()=>{
  (UI.sleepT||[]).forEach(clearTimeout);UI.sleepT=null;
  const arg=UI.sleepArg||{};UI.sleepArg=null;
  S.rel.mM=clamp(S.rel.mM+6,0,100);S.rel.mD=clamp(S.rel.mD+6,0,100);
  if(S.pet){S.pet.energy=100;S.pet.happy=clamp(S.pet.happy+3,0,100)}
  let g=0;
  if(arg.rel){g=relAct('sleep',3,4)}
  save();
  if(arg.lvl){UI.stack=['menu'];UI.screen='x';go('map',null,true);return}
  UI.screen='x';
  const p=UI.stack.pop()||'menu';go(p,null,true);
  if(arg.rel)relModal('🌙','Спокойной ночи',pick(TALK.sleep),g);
};

/* ===== 12. ЗАПУСК ===== */
function makeIcon(){
  return; // иконка теперь файл apple-touch-icon.png
  try{
    const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#ffd3e0');g.addColorStop(1,'#ef8fab');x.fillStyle=g;x.fillRect(0,0,180,180);
    x.font='96px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('💞',90,98);
    $('#touchIcon').href=c.toDataURL('image/png');
  }catch(e){}
}
let booted=false;
async function boot(){
  if(booted)return;booted=true;
  try{document.body.insertAdjacentHTML('afterbegin',FRUIT_DEFS)}catch(e){}
  try{makeIcon()}catch(e){}
  try{S=await loadState()}catch(e){S=defaultState()}
  if(!S)S=defaultState();
  try{rollDay()}catch(e){}
  document.body.classList.toggle('calm',!!S.set.calm);
  renderTop();checkAch();
  go('menu',null,true);
  if(!S.intro){
    S.intro=true;save();
    modal(`<h3>Добро пожаловать в «Психички»! 🌸</h3><div class="row" style="justify-content:center">${av('m',84,'cute')}${av('d',84)}</div><p class="center">Мишель и Диана ждут тебя. Проходи уровни, обустраивай дом, готовь, убирайся и заботься друг о друге.</p><p class="muted center">Прогресс сохраняется автоматически в этом браузере. Делай экспорт в настройках как резервную копию.</p><div class="mbtns"><button class="btn" data-a="closeModal">Начать 💖</button></div>`);
  }else if(dailyInfo().can){
    modal(`<h3>Новый день! ☀️</h3><p class="center">Ежедневная награда уже ждёт тебя в «Заданиях».</p><div class="mbtns"><button class="btn sec" data-a="closeModal">Позже</button><button class="btn" data-a="dailyGo">Забрать 🎁</button></div>`);
  }
}
A.dailyGo=()=>{UI.taskTab='daily';go('tasks')};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S)save(true)});
window.addEventListener('pagehide',()=>{if(S)save(true)});
window.addEventListener('error',e=>{try{console.warn('Ошибка:',e.message);let b=document.getElementById('errBar');if(!b){b=document.createElement('div');b.id='errBar';b.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:200;background:#5b3f3a;color:#fff;border-radius:14px;padding:8px 12px;font:12px sans-serif;opacity:.92';document.body.appendChild(b)}b.textContent='Ошибка: '+e.message+' (стр. '+e.lineno+')'}catch(_){}});
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
setTimeout(()=>{if(!booted)boot()},3000);

// PWA: офлайн-кэш (работает только когда игра открыта по https:// или http://localhost)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}});
}

</script>
